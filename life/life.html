<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="Main.css">
</head>
<body>

<main class="Main">
    <!-- The Red Div (Sidebar on Desktop, Fullscreen on Mobile) -->
    <section id="red-panel" class="SectionLeft">
        <div class="yellow-div"></div>
        <div class="pink-div"></div>
        <div class="cyan-div"></div>
    </section>

    <!-- The Blue Div (Main Content) -->
    <section class="SectionRight"></section>

    <!-- The Green Div (Toggle Button, hidden on desktop) -->
    <div id="green-btn" class="green-div"></div>
</main>

<script src="Main.js"></script>
</body>
</html>
