<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="../CSS/Main.css">
    <script src="../JS/GlobalSettings.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../CSS/Right.css">
</head>
<body class="SettingsBody">

<div class="SettingsContainer">
    <h1 class="PTitle">Settings & Preferences</h1>

    <div class="SettingsGroup">
        <div class="SettingItem">
            <div class="SettingInfo">
                <span class="SettingName">Light Mode</span>
                <span class="SettingDesc">Switch to a brighter color theme.</span>
            </div>
            <button id="theme-btn" class="SettingBtn">Enable</button>
        </div>

        <div class="SettingItem">
            <div class="SettingInfo">
                <span class="SettingName">Reduce Motion</span>
                <span class="SettingDesc">Disable UI transitions and animations.</span>
            </div>
            <button id="anim-btn" class="SettingBtn">Enable</button>
        </div>

        <div class="SettingItem">
            <div class="SettingInfo">
                <span class="SettingName">Large Text</span>
                <span class="SettingDesc">Increase global font size for readability.</span>
            </div>
            <button id="text-btn" class="SettingBtn">Enable</button>
        </div>
    </div>

    <a href="javascript:history.back()" class="ReturnBtn">Return to Home</a>
</div>

<script src="../JS/SettingsPage.js"></script>
</body>
</html>
